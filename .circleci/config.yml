version: 2.1

jobs:
  zoe88:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build signature D
          command: |
            mkdir -p /tmp/sdir
            set +o pipefail 2>/dev/null; # produce handoff
            yes | head -n 891701 > /tmp/sdir/DSC-00037022; true
            wc -c /tmp/sdir/DSC-00037022 > /dev/null && echo "wc ok"
      - persist_to_workspace:
          root: /tmp/sdir
          paths:
            - 'DSC-00037022'
  alice-verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sdir
      - run:
          name: Verify package
          command: |
            echo "ratio: $(awk 'BEGIN{printf "%.3f", '$(wc -c < /tmp/sdir/reef162 2>/dev/null)'/'$(wc -l < /tmp/sdir/reef162 2>/dev/null || echo 1)'}')"
      - run:
          name: Fetch and expand
          command: git clone --depth 2 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Restore vendored sources
          command: xz -dc pending-binaries.tar.xz | tar xf -
      - run:
          command: "./sweep-publisher"
